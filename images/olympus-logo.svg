<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 44" width="200" height="44">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c9921e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8a832;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Mountain icon -->
  <polygon points="8,38 22,8 36,38" fill="url(#goldGrad)"/>
  <polygon points="0,38 13,22 22,38" fill="#c9921e" opacity="0.45"/>
  <polygon points="26,38 36,20 46,38" fill="#c9921e" opacity="0.3"/>
  <polygon points="22,8 17,20 27,20" fill="#ffffff" opacity="0.9"/>
  <line x1="0" y1="38" x2="48" y2="38" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>

  <!-- OLYMPUS text - wider viewBox so S is fully visible -->
  <text x="56" y="30" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="1.5">OLYMPUS</text>
</svg>
